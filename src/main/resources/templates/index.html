<!DOCTYPE html>
<html xmln:th="http:www.thymeleaf.org" xmlns:xmln="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>

    <h1>Todo List</h1>
    <form action="/sort" method="get">
        <input type="text" name="keyword"
               th:value = "${keyword}">
        <select name="sortType">
            <option value="dueDateAsc" th:selected="${sortType == 'dueDateAsc'}">
                마감일 빠른 순
            </option>
            <option value="dueDateDesc" th:selected="${sortType == 'dueDateDesc'}">
                마감일 늦은 순
            </option>
            <option value="latest" th:selected="${sortType == 'latest'}">
                최신 등록순
            </option>
        </select>
        <button type="submit">검색 ㅁㅣㅊ 정렬</button>
    </form>
    <!--    <a th:href="@{/sort(keyword=${keyword})}">-->
    <!--        &lt;!&ndash;검색어가 면도 /sort?keyword=면도 &ndash;&gt;-->
    <!--        마감일순-->
    <!--    </a>-->

    <hr>

    <ul>
      <li th:each = "todo :${todos}">
        <span th:style="${todo.done} ?
        'text-decoration: line-through' : ''" th:text="${todo.text}">
        </span>
          <span>
              중요도:<strong th:text = "${todo.priority}"></strong>
          </span>
          <span>
              마감일:<strong th:text ="${todo.dueDate}"></strong>
          </span>

          <a th:href ="@{/toggle/{id}(
          id=${todo.id},
          keyword=${keyword},
          sortType=${sortType}
          )}">완료</a>
          <form th:action="@{/toggle/{id}(id=${todo.id})}" method="post" style="display: inline">
              <input type="hidden" name="keyword" th:value="${keyword}">
              <input type="hidden" name="sortType" th:value="${sortType}">
              <button type="submit">완료</button>
          </form>
          <!--
           id -> url경로로 /toggle/3

           keyword POST from data
           sortType POST from data
           -->
          <a th:href ="@{'/edit/' + ${todo.id}}">수정</a>
          <a th:href ="@{/toggle/{id}(
          id=${todo.id},
          keyword=${keyword},
          sortType=${sortType}
          )}">삭제</a>
          <form th:action="@{/delete/{id}(id=${todo.id})}" method="post" style="display: inline">
              <input type="hidden" name="keyword" th:value="${keyword}">
              <input type="hidden" name="sortType" th:value="${sortType}">
              <button type="submit">삭제</button>
          </form>
          <!-- 왜 method = delete가 아닐까?
          기본 HTML
          -->


      </li>
    </ul>
</body>
</html>
